    WITH top AS (
      SELECT product_name FROM order_line_revenue
      WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
      GROUP BY product_name ORDER BY SUM(units) DESC LIMIT 5
    )
    SELECT l.product_name, SUM(l.net_revenue_usd) AS net_revenue_usd FROM order_line_revenue l
    JOIN top USING (product_name)
    WHERE l.ordered_at >= DATE '2025-01-01' AND l.ordered_at < DATE '2026-01-01'
    GROUP BY l.product_name
- id: follow_08
  category: follow_up
  follow_up_of: follow_07
