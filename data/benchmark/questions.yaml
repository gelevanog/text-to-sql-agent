      WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-10-01'
      GROUP BY product_name ORDER BY SUM(units) DESC LIMIT 5
    )
    SELECT l.product_name, SUM(l.net_revenue_usd) AS net_revenue_usd FROM order_line_revenue l
    JOIN top USING (product_name)
    WHERE l.ordered_at >= DATE '2026-01-01' AND l.ordered_at < DATE '2026-10-01'
    GROUP BY l.product_name
