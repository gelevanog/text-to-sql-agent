    SELECT SUM(p.amount * fx.usd_per_unit) AS received_usd
    FROM payments p JOIN orders o ON o.id = p.order_id JOIN customers c ON c.id = o.customer_id
    JOIN fx_rates fx ON fx.currency_code = p.currency_code AND fx.rate_date = CAST(p.paid_at AT TIME ZONE 'UTC' AS DATE)
    WHERE p.status = 'succeeded' AND NOT c.is_test_account
      AND p.paid_at >= DATE '2026-09-01' AND p.paid_at < DATE '2026-10-01'
  notes: Payments convert on the payment date; failed attempts and test accounts are excluded.
