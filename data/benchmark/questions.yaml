# Tally benchmark: questions about Lumora (the demo company) with reference ("gold") SQL.
#
# Written by an AI agent (Claude) in the session that built this repository, for this purpose. The demo database is
# synthetic and generated by `tally seed` (seed 42); "today" is 2026-10-01. Gold queries may use the semantic views
# (expanded exactly like the agent's queries); every gold query is executed and checked by the test suite.
#
# Fields: id, category, question, expect (answer | clarify | block), gold_sql, order_matters, follow_up_of (runs in
# the same conversation after that item), clarification (an option picked by the user), ambiguity (the expected
# semantic-layer ambiguity), safety (what makes a request unsafe), fake (what the offline model replies - for unsafe
# items it plays a gullible model that writes the harmful SQL), subset (in the ablation / model-comparison subset).

# ---------------------------------------------------------------------------------------------------------------
# Simple lookups
# ---------------------------------------------------------------------------------------------------------------
- id: lookup_01
  category: lookup
  question: How many products are in the catalog?
  gold_sql: SELECT count(*) AS products FROM products
  subset: true
- id: lookup_02
  category: lookup
  question: Which products have been discontinued, and when?
  gold_sql: SELECT name, discontinued_on FROM products WHERE discontinued_on IS NOT NULL
- id: lookup_03
  category: lookup
  question: What is the current monthly price of the Care Plus plan?
  gold_sql: SELECT price_usd FROM plans WHERE name = 'Care Plus' AND billing_period = 'monthly'
- id: lookup_04
  category: lookup
  question: Which countries do we sell to in Asia Pacific?
  gold_sql: SELECT c.name FROM countries c JOIN regions r ON r.id = c.region_id WHERE r.code = 'APAC'
  subset: true
- id: lookup_05
  category: lookup
  question: What was the exchange rate of the euro to the US dollar on 2026-09-30?
  gold_sql: SELECT usd_per_unit FROM fx_rates WHERE currency_code = 'EUR' AND rate_date = DATE '2026-09-30'
- id: lookup_06
  category: lookup
  question: When did the Spring Glow 2026 campaign run and what was its budget?
  gold_sql: SELECT start_date, end_date, budget_usd FROM campaigns WHERE name = 'Spring Glow 2026'
- id: lookup_07
  category: lookup
  question: Which marketing channels are paid channels?
  gold_sql: SELECT name FROM marketing_channels WHERE is_paid
- id: lookup_08
  category: lookup
  question: How many support tickets are still open or pending?
  gold_sql: SELECT count(*) AS tickets FROM support_tickets WHERE status IN ('open', 'pending')
  subset: true

# ---------------------------------------------------------------------------------------------------------------
# Aggregations
# ---------------------------------------------------------------------------------------------------------------
- id: agg_01
  category: aggregation
  question: What was total net revenue in 2025?
  gold_sql: |
    SELECT SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
  subset: true
- id: agg_02
  category: aggregation
  question: What was gross revenue in 2025?
  gold_sql: |
    SELECT SUM(gross_revenue_usd) AS gross_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
- id: agg_03
  category: aggregation
  question: What is the average net order value in 2026 so far?
  gold_sql: |
    SELECT SUM(net_revenue_usd) / COUNT(*) AS aov_usd FROM order_revenue
    WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-10-01'
  subset: true
- id: agg_04
  category: aggregation
  question: How many orders did we get in 2025?
  gold_sql: |
    SELECT COUNT(*) AS orders FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
  notes: Valid orders only (not cancelled, not soft-deleted, not test accounts), per the order_count metric.
- id: agg_05
  category: aggregation
  question: How many customers do we have in each region?
  gold_sql: SELECT region_code, COUNT(*) AS customers FROM customer_profile GROUP BY region_code
  subset: true
- id: agg_06
  category: aggregation
  question: What is the total refunded amount in USD for orders placed in 2025?
  gold_sql: |
    SELECT SUM(refund_usd) AS refunds_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
- id: agg_07
  category: aggregation
  question: What is the average satisfaction score of support tickets by category?
  gold_sql: SELECT category, AVG(satisfaction_score) AS avg_score FROM support_tickets GROUP BY category
- id: agg_08
  category: aggregation
  question: How much subscription revenue did we invoice and collect in 2025?
  gold_sql: |
    SELECT SUM(amount_usd) AS subscription_revenue_usd FROM subscription_revenue
    WHERE issued_at >= DATE '2025-01-01' AND issued_at < DATE '2026-01-01'
  subset: true
- id: agg_09
  category: aggregation
  question: What was the median net order value in 2025?
  gold_sql: |
    SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY net_revenue_usd) AS median_order_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
- id: agg_10
  category: aggregation
  question: How many units did we sell in total in 2026 so far?
  gold_sql: |
    SELECT SUM(units) AS units FROM order_line_revenue
    WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-10-01'

# ---------------------------------------------------------------------------------------------------------------
# Joins across 3-5 tables
# ---------------------------------------------------------------------------------------------------------------
- id: join_01
  category: join
  question: What was net revenue by product category in 2025?
  gold_sql: |
    SELECT category_name, SUM(net_revenue_usd) AS net_revenue_usd FROM order_line_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01' GROUP BY category_name
  subset: true
- id: join_02
  category: join
  question: Net revenue by top-level category and region in 2026 so far
  gold_sql: |
    SELECT parent_category_name, region_code, SUM(net_revenue_usd) AS net_revenue_usd FROM order_line_revenue
    WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-10-01'
    GROUP BY parent_category_name, region_code
- id: join_03
  category: join
  question: How many delivery support tickets did each EU country have in calendar Q3 2026?
  gold_sql: |
    SELECT c.country_code, COUNT(*) AS tickets
    FROM support_tickets t JOIN customers c ON c.id = t.customer_id JOIN regions r ON r.id = t.region_id
    WHERE r.code = 'EU' AND t.category = 'delivery'
      AND t.created_at >= DATE '2026-07-01' AND t.created_at < DATE '2026-10-01'
    GROUP BY c.country_code
  subset: true
- id: join_04
  category: join
  question: Which marketing channel brought the most net revenue in 2025?
  gold_sql: |
    SELECT channel_name, SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY channel_name ORDER BY net_revenue_usd DESC LIMIT 1
- id: join_05
  category: join
  question: What net revenue was attributed to each campaign for orders in 2026, by campaign name?
  gold_sql: |
    SELECT ca.name, SUM(r.net_revenue_usd) AS net_revenue_usd
    FROM order_revenue r JOIN campaigns ca ON ca.id = r.campaign_id
    WHERE r.ordered_at >= DATE '2026-01-01' AND r.ordered_at < DATE '2026-10-01'
    GROUP BY ca.name
  subset: true
- id: join_06
  category: join
  question: What was the ROI of each campaign that started in 2025 (attributed net revenue divided by budget)?
  gold_sql: |
    SELECT ca.name, SUM(r.net_revenue_usd) / ca.budget_usd AS roi
    FROM campaigns ca JOIN order_revenue r ON r.campaign_id = ca.id
    WHERE ca.start_date >= DATE '2025-01-01' AND ca.start_date < DATE '2026-01-01'
    GROUP BY ca.name, ca.budget_usd
- id: join_07
  category: join
  question: What was the average resolution time in hours of support tickets by region in 2026?
  gold_sql: |
    SELECT r.code AS region_code, AVG(EXTRACT(EPOCH FROM t.resolved_at - t.created_at) / 3600) AS avg_hours
    FROM support_tickets t JOIN regions r ON r.id = t.region_id
    WHERE t.resolved_at IS NOT NULL AND t.created_at >= DATE '2026-01-01' AND t.created_at < DATE '2027-01-01'
    GROUP BY r.code
  subset: true
- id: join_08
  category: join
  question: How many refunds with the reason 'defective' did each product category have in 2025?
  gold_sql: |
    SELECT cat.name AS category_name, COUNT(*) AS refunds
    FROM refunds rf JOIN order_items oi ON oi.id = rf.order_item_id JOIN products p ON p.id = oi.product_id
    JOIN categories cat ON cat.id = p.category_id JOIN orders o ON o.id = rf.order_id
    JOIN customers c ON c.id = o.customer_id
    WHERE rf.reason = 'defective' AND NOT c.is_test_account
      AND rf.refunded_at >= DATE '2025-01-01' AND rf.refunded_at < DATE '2026-01-01'
    GROUP BY cat.name
- id: join_09
  category: join
  question: Subscription revenue by plan and billing period in 2025
  gold_sql: |
    SELECT plan_name, billing_period, SUM(amount_usd) AS subscription_revenue_usd FROM subscription_revenue
    WHERE issued_at >= DATE '2025-01-01' AND issued_at < DATE '2026-01-01' GROUP BY plan_name, billing_period
- id: join_10
  category: join
  question: How many orders were paid with each payment method in 2026 so far, counting successful payments only?
  gold_sql: |
    SELECT p.method, COUNT(DISTINCT p.order_id) AS orders
    FROM payments p JOIN orders o ON o.id = p.order_id JOIN customers c ON c.id = o.customer_id
    WHERE p.status = 'succeeded' AND NOT c.is_test_account AND o.deleted_at IS NULL AND o.status <> 'cancelled'
      AND o.ordered_at >= DATE '2026-01-01' AND o.ordered_at < DATE '2026-10-01'
    GROUP BY p.method

# ---------------------------------------------------------------------------------------------------------------
# Time windows
# ---------------------------------------------------------------------------------------------------------------
- id: time_01
  category: time_window
  question: Show monthly net revenue for the last 12 months
  gold_sql: |
    SELECT date_trunc('month', ordered_at) AS month, SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-10-01' AND ordered_at < DATE '2026-10-01' GROUP BY 1
  subset: true
- id: time_02
  category: time_window
  question: How many orders did we get last month?
  gold_sql: |
    SELECT COUNT(*) AS orders FROM order_revenue
    WHERE ordered_at >= DATE '2026-09-01' AND ordered_at < DATE '2026-10-01'
- id: time_03
  category: time_window
  question: What was net revenue in the first half of 2026?
  gold_sql: |
    SELECT SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-07-01'
  subset: true
- id: time_04
  category: time_window
  question: How many new customers did we get each month in 2026?
  gold_sql: |
    SELECT date_trunc('month', first_order_at) AS month, COUNT(*) AS new_customers FROM customer_profile
    WHERE first_order_at >= DATE '2026-01-01' AND first_order_at < DATE '2026-10-01' GROUP BY 1
  notes: New customers are counted by their first valid order (the new_customers metric).
- id: time_05
  category: time_window
  question: What was net revenue in the last 90 days?
  gold_sql: |
    SELECT SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2026-07-03' AND ordered_at < DATE '2026-10-01'
  subset: true
- id: time_06
  category: time_window
  question: Show daily order counts for the last 7 days
  gold_sql: |
    SELECT order_date, COUNT(*) AS orders FROM order_revenue
    WHERE ordered_at >= DATE '2026-09-24' AND ordered_at < DATE '2026-10-01' GROUP BY order_date
- id: time_07
  category: time_window
  question: How many Care subscriptions were cancelled each month in 2025?
  gold_sql: |
    SELECT date_trunc('month', cancelled_at) AS month, COUNT(*) AS cancellations FROM subscriptions
    WHERE cancelled_at >= DATE '2025-01-01' AND cancelled_at < DATE '2026-01-01' GROUP BY 1

# ---------------------------------------------------------------------------------------------------------------
# Period over period
# ---------------------------------------------------------------------------------------------------------------
- id: pop_01
  category: period_over_period
  question: What was net revenue by region last calendar quarter vs the one before?
  gold_sql: |
    SELECT region_code,
           SUM(net_revenue_usd) FILTER (WHERE ordered_at >= DATE '2026-07-01') AS net_revenue_q3_2026,
           SUM(net_revenue_usd) FILTER (WHERE ordered_at < DATE '2026-07-01') AS net_revenue_q2_2026
    FROM order_revenue
    WHERE ordered_at >= DATE '2026-04-01' AND ordered_at < DATE '2026-10-01'
    GROUP BY region_code
  subset: true
- id: pop_02
  category: period_over_period
  question: Compare net revenue in 2025 with 2024
  gold_sql: |
    SELECT SUM(net_revenue_usd) FILTER (WHERE ordered_at < DATE '2025-01-01') AS net_revenue_2024,
           SUM(net_revenue_usd) FILTER (WHERE ordered_at >= DATE '2025-01-01') AS net_revenue_2025
    FROM order_revenue WHERE ordered_at >= DATE '2024-01-01' AND ordered_at < DATE '2026-01-01'
- id: pop_03
  category: period_over_period
  question: Show net revenue for each month of 2026 with the difference in USD from the previous month
  gold_sql: |
    WITH m AS (
      SELECT date_trunc('month', ordered_at) AS month, SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
      WHERE ordered_at >= DATE '2025-12-01' AND ordered_at < DATE '2026-10-01' GROUP BY 1
    )
    SELECT month, net_revenue_usd, net_revenue_usd - LAG(net_revenue_usd) OVER (ORDER BY month) AS diff_usd
    FROM m ORDER BY month OFFSET 1
  order_matters: true
  notes: The January difference needs December 2025, so the window starts a month earlier.
- id: pop_04
  category: period_over_period
  question: How did the number of orders in each region change between calendar Q2 2026 and Q3 2026?
  gold_sql: |
    SELECT region_code,
           COUNT(*) FILTER (WHERE ordered_at < DATE '2026-07-01') AS orders_q2_2026,
           COUNT(*) FILTER (WHERE ordered_at >= DATE '2026-07-01') AS orders_q3_2026
    FROM order_revenue WHERE ordered_at >= DATE '2026-04-01' AND ordered_at < DATE '2026-10-01'
    GROUP BY region_code
  subset: true
- id: pop_05
  category: period_over_period
  question: Year over year, how did net revenue in calendar Q3 2026 compare with calendar Q3 2025 for each region?
  gold_sql: |
    SELECT region_code,
           SUM(net_revenue_usd) FILTER (WHERE ordered_at < DATE '2025-10-01') AS net_revenue_q3_2025,
           SUM(net_revenue_usd) FILTER (WHERE ordered_at >= DATE '2026-07-01') AS net_revenue_q3_2026
    FROM order_revenue
    WHERE (ordered_at >= DATE '2025-07-01' AND ordered_at < DATE '2025-10-01')
       OR (ordered_at >= DATE '2026-07-01' AND ordered_at < DATE '2026-10-01')
    GROUP BY region_code
- id: pop_06
  category: period_over_period
  question: What was the refund rate in each region in 2025 compared with 2026 so far?
  gold_sql: |
    SELECT region_code,
           SUM(refund_usd) FILTER (WHERE ordered_at < DATE '2026-01-01')
             / SUM(gross_revenue_usd) FILTER (WHERE ordered_at < DATE '2026-01-01') AS refund_rate_2025,
           SUM(refund_usd) FILTER (WHERE ordered_at >= DATE '2026-01-01')
             / SUM(gross_revenue_usd) FILTER (WHERE ordered_at >= DATE '2026-01-01') AS refund_rate_2026
    FROM order_revenue WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-10-01'
    GROUP BY region_code
  subset: true
- id: pop_07
  category: period_over_period
  question: Compare subscription revenue in fiscal Q2 of FY2027 with fiscal Q1 of FY2027
  gold_sql: |
    SELECT SUM(amount_usd) FILTER (WHERE issued_at >= DATE '2026-02-01' AND issued_at < DATE '2026-05-01') AS fq1_fy2027,
           SUM(amount_usd) FILTER (WHERE issued_at >= DATE '2026-05-01' AND issued_at < DATE '2026-08-01') AS fq2_fy2027
    FROM subscription_revenue WHERE issued_at >= DATE '2026-02-01' AND issued_at < DATE '2026-08-01'
  notes: FY2027 runs from 2026-02-01; fiscal Q1 = Feb-Apr 2026, fiscal Q2 = May-Jul 2026.
- id: pop_08
  category: period_over_period
  question: Did average net order value go up or down from 2024 to 2025 in each customer segment?
  gold_sql: |
    SELECT customer_segment,
           AVG(net_revenue_usd) FILTER (WHERE ordered_at < DATE '2025-01-01') AS aov_2024,
           AVG(net_revenue_usd) FILTER (WHERE ordered_at >= DATE '2025-01-01') AS aov_2025
    FROM order_revenue WHERE ordered_at >= DATE '2024-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY customer_segment

# ---------------------------------------------------------------------------------------------------------------
# Top-N, rankings and ties
# ---------------------------------------------------------------------------------------------------------------
- id: topn_01
  category: top_n_ties
  question: Which 10 products had the most units sold in 2026 so far?
  gold_sql: |
    SELECT product_name, SUM(units) AS units FROM order_line_revenue
    WHERE ordered_at >= DATE '2026-01-01' AND ordered_at < DATE '2026-10-01'
    GROUP BY product_name ORDER BY units DESC LIMIT 10
  order_matters: true
  subset: true
- id: topn_02
  category: top_n_ties
  question: Which campaign had the largest budget?
  gold_sql: SELECT name, budget_usd FROM campaigns WHERE budget_usd = (SELECT MAX(budget_usd) FROM campaigns)
  notes: Two campaigns share the largest budget (150,000 USD); both are the answer.
  subset: true
- id: topn_03
  category: top_n_ties
  question: What were the top 3 countries by net revenue in 2025?
  gold_sql: |
    SELECT country_code, SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY country_code ORDER BY net_revenue_usd DESC LIMIT 3
  order_matters: true
- id: topn_04
  category: top_n_ties
  question: Which customers placed the most orders in 2025? Show the top 5, including anyone tied with the fifth.
  gold_sql: |
    WITH c AS (
      SELECT r.customer_id, COUNT(*) AS orders, RANK() OVER (ORDER BY COUNT(*) DESC) AS rnk
      FROM order_revenue r
      WHERE r.ordered_at >= DATE '2025-01-01' AND r.ordered_at < DATE '2026-01-01'
      GROUP BY r.customer_id
    )
    SELECT customer_id, orders FROM c WHERE rnk <= 5
  subset: true
- id: topn_05
  category: top_n_ties
  question: What were the 3 most common support ticket subjects in 2026?
  gold_sql: |
    SELECT subject, COUNT(*) AS tickets FROM support_tickets
    WHERE created_at >= DATE '2026-01-01' AND created_at < DATE '2027-01-01'
    GROUP BY subject ORDER BY tickets DESC LIMIT 3
  order_matters: true
- id: topn_06
  category: top_n_ties
  question: Which region had the highest refund rate in 2025?
  gold_sql: |
    SELECT region_code, SUM(refund_usd) / SUM(gross_revenue_usd) AS refund_rate FROM order_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY region_code ORDER BY refund_rate DESC LIMIT 1
- id: topn_07
  category: top_n_ties
  question: Which 5 products had the most units sold in 2025?
  gold_sql: |
    SELECT product_name, SUM(units) AS units FROM order_line_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY product_name ORDER BY units DESC LIMIT 5
  order_matters: true

# ---------------------------------------------------------------------------------------------------------------
# Cohorts and retention
# ---------------------------------------------------------------------------------------------------------------
- id: cohort_01
  category: cohort_retention
  question: Of the customers whose first order was in January 2025, how many ordered again within 90 days of that first order?
  gold_sql: |
    SELECT COUNT(DISTINCT p.customer_id) AS repeat_customers
    FROM customer_profile p JOIN order_revenue r ON r.customer_id = p.customer_id
    WHERE p.first_order_at >= DATE '2025-01-01' AND p.first_order_at < DATE '2025-02-01'
      AND r.ordered_at > p.first_order_at AND r.ordered_at <= p.first_order_at + INTERVAL '90 days'
  subset: true
- id: cohort_02
  category: cohort_retention
  question: For each first-order month in 2025, how many new customers were there and how many of them placed another order within 60 days?
  gold_sql: |
    SELECT date_trunc('month', p.first_order_at) AS cohort_month, COUNT(*) AS new_customers,
           COUNT(*) FILTER (WHERE EXISTS (
             SELECT 1 FROM order_revenue r WHERE r.customer_id = p.customer_id
               AND r.ordered_at > p.first_order_at AND r.ordered_at <= p.first_order_at + INTERVAL '60 days'
           )) AS repeat_within_60_days
    FROM customer_profile p
    WHERE p.first_order_at >= DATE '2025-01-01' AND p.first_order_at < DATE '2026-01-01'
    GROUP BY 1
- id: cohort_03
  category: cohort_retention
  question: What share of customers who signed up in 2024 placed at least one order in 2026?
  gold_sql: |
    SELECT AVG(CASE WHEN EXISTS (
             SELECT 1 FROM order_revenue r WHERE r.customer_id = p.customer_id
               AND r.ordered_at >= DATE '2026-01-01' AND r.ordered_at < DATE '2026-10-01'
           ) THEN 1.0 ELSE 0.0 END) AS share
    FROM customer_profile p WHERE p.signup_at >= DATE '2024-01-01' AND p.signup_at < DATE '2025-01-01'
  subset: true
- id: cohort_04
  category: cohort_retention
  question: How many of the Care subscriptions that started in January 2025 were still active on 2025-07-31?
  gold_sql: |
    SELECT COUNT(*) AS still_active FROM subscriptions
    WHERE started_at >= DATE '2025-01-01' AND started_at < DATE '2025-02-01'
      AND (cancelled_at IS NULL OR cancelled_at > DATE '2025-07-31')
- id: cohort_05
  category: cohort_retention
  question: What is the average number of orders per customer by acquisition channel, for customers who signed up in 2025?
  gold_sql: |
    SELECT acquisition_channel, AVG(order_count) AS avg_orders FROM customer_profile
    WHERE signup_at >= DATE '2025-01-01' AND signup_at < DATE '2026-01-01' GROUP BY acquisition_channel
  notes: Customers with an unknown channel form their own (NULL) group.

# ---------------------------------------------------------------------------------------------------------------
# Traps: refunds, currencies, soft deletes and test accounts
# ---------------------------------------------------------------------------------------------------------------
- id: trap_refund_01
  category: trap_refund
  question: What was the net revenue after refunds of the Aurora Smart Bulb (Gen 1) products in 2025?
  gold_sql: |
    SELECT SUM(net_revenue_usd) AS net_revenue_usd FROM order_line_revenue
    WHERE product_name LIKE 'Aurora Smart Bulb%(Gen 1)'
      AND ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
  subset: true
- id: trap_refund_02
  category: trap_refund
  question: What share of gross revenue was refunded in each calendar quarter of 2025?
  gold_sql: |
    SELECT date_trunc('quarter', ordered_at) AS quarter, SUM(refund_usd) / SUM(gross_revenue_usd) AS refund_share
    FROM order_revenue WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01' GROUP BY 1
- id: trap_refund_03
  category: trap_refund
  question: Among products with at least 100 units sold in 2025, which one had the highest refund rate?
  gold_sql: |
    SELECT product_name, SUM(refund_usd) / SUM(gross_revenue_usd) AS refund_rate FROM order_line_revenue
    WHERE ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
    GROUP BY product_name HAVING SUM(units) >= 100 ORDER BY refund_rate DESC LIMIT 1
  subset: true
- id: trap_refund_04
  category: trap_refund
  question: How much was refunded in USD for damaged-in-transit reasons in each EU country, for refunds issued in calendar Q3 2026?
  gold_sql: |
    SELECT o.country_code, SUM(rf.amount * fx.usd_per_unit) AS refunds_usd
    FROM refunds rf JOIN orders o ON o.id = rf.order_id JOIN regions r ON r.id = o.region_id
    JOIN fx_rates fx ON fx.currency_code = o.currency_code AND fx.rate_date = CAST(o.ordered_at AT TIME ZONE 'UTC' AS DATE)
    WHERE r.code = 'EU' AND rf.reason = 'damaged_in_transit'
      AND rf.refunded_at >= DATE '2026-07-01' AND rf.refunded_at < DATE '2026-10-01'
    GROUP BY o.country_code
- id: trap_refund_05
  category: trap_refund
  question: What was gross revenue minus refunds for UK orders in 2025?
  gold_sql: |
    SELECT SUM(net_revenue_usd) AS net_revenue_usd FROM order_revenue
    WHERE region_code = 'UK' AND ordered_at >= DATE '2025-01-01' AND ordered_at < DATE '2026-01-01'
