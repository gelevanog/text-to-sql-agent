# ---------------------------------------------------------------------------------------------------------------
# Time zones
# ---------------------------------------------------------------------------------------------------------------
- id: tz_01
  category: timezone
  question: At which local hour of the day did APAC customers place the most orders in 2025?
  gold_sql: |
    SELECT EXTRACT(HOUR FROM r.ordered_at AT TIME ZONE g.timezone) AS local_hour, COUNT(*) AS orders
    FROM order_revenue r JOIN regions g ON g.code = r.region_code
    WHERE r.region_code = 'APAC' AND r.ordered_at >= DATE '2025-01-01' AND r.ordered_at < DATE '2026-01-01'
    GROUP BY 1 ORDER BY orders DESC LIMIT 1
  subset: true
- id: tz_02
  category: timezone
  question: How many orders did North American customers place on New Year's Day 2026, New York local time?
  gold_sql: |
    SELECT COUNT(*) AS orders FROM order_revenue
    WHERE region_code = 'NA' AND CAST(ordered_at AT TIME ZONE 'America/New_York' AS DATE) = DATE '2026-01-01'
- id: tz_03
  category: timezone
  question: How many EU orders were placed between 18:00 and midnight Berlin time in September 2026 (Berlin dates)?
  gold_sql: |
    SELECT COUNT(*) AS orders FROM order_revenue
    WHERE region_code = 'EU'
      AND ordered_at AT TIME ZONE 'Europe/Berlin' >= TIMESTAMP '2026-09-01'
      AND ordered_at AT TIME ZONE 'Europe/Berlin' < TIMESTAMP '2026-10-01'
      AND EXTRACT(HOUR FROM ordered_at AT TIME ZONE 'Europe/Berlin') >= 18

